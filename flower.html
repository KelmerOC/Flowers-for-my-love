<body class="container">
  <audio id="bgMusic" src="sound/ChristianBasso&HaienQiu-Flowers.mp3" preload="auto" loop></audio>

  <!-- Control de Música Flotante -->
  <div class="music-player-widget" id="musicPlayer" title="Reproducir / Pausar Música">
    <div class="music-disc" id="musicDisc">🎵</div>
    <div class="music-bars" id="musicBars">
      <span class="bar bar-1"></span>
      <span class="bar bar-2"></span>
      <span class="bar bar-3"></span>
    </div>
    <span class="music-hint" id="musicHint">Música</span>

  <!-- Botón para reabrir dedicatoria si se minimiza -->
  <button class="reopen-card-btn" id="btnReopenCard" style="display: none;" title="Ver mensaje de amor">
    <span>💌 Ver dedicatoria</span>
  </button>

  <!-- Tarjeta de Dedicatoria Personalizada (Opción C) -->
  <div class="dedication-card" id="dedicationCard">
    <div class="card-glow"></div>
    <div class="card-header">
      <span class="tag-love">✨ Para mi Canela ✨</span>
      <button class="btn-close-card" id="btnCloseCard" title="Minimizar dedicatoria">✕</button>
    </div>
    <h1 class="card-title">Jenny, mi niña hermosa ✨ mi Canela</h1>
    <p class="card-message">
      El mundo se vuelve más cálido y brillante contigo. Estas flores amarillas son para recordarte lo mucho que te amo
      y lo especial que eres para mí. Gracias por iluminar cada instante con tu sonrisa.
    </p>
    <div class="card-footer">
      <span class="footer-note">Con todo mi amor siempre 🌻💛</span>
    </div>
  </div>

  <!-- Letras de la canción sincronizadas -->
  <div id="lyrics"></div>

  <!-- Fondo de noche y canvas de partículas (estrellas, luciérnagas y pétalos cayendo) -->
  <div class="night"></div>
  <canvas id="ambientCanvas"></canvas>
